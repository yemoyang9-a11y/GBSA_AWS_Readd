# 백엔드 배포 — Fly.io
#
# @see docs/migration.md — Phase 2 (EC2 + SSM + PM2 → Fly.io, 2026-08-29)
#
# 예전 워크플로는 S3 에 tar.gz 를 올리고 SSM RunCommand 로 EC2 두 대에서 압축을 풀어
# PM2 를 재시작했다. 그 경로가 전부 사라졌다 — Fly 가 이미지를 빌드하고 머신을 굴린다.
#
# ⚠️ 필요한 시크릿: FLY_API_TOKEN
#    발급: fly tokens create deploy -x 999999h
#    등록: GitHub 저장소 → Settings → Secrets and variables → Actions
#
#    앱의 런타임 비밀값(ANTHROPIC_API_KEY 등)은 여기 두지 않는다 — `fly secrets set`
#    으로 Fly 에 직접 넣고, 배포는 그걸 그대로 물려받는다.

name: Deploy Backend to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# 같은 브랜치의 배포가 겹치면 뒤엣것만 남긴다 — 앞선 배포를 취소해
# 두 배포가 동시에 머신을 갈아치우는 상황을 막는다
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트 (게이트 조항 검증)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Node 22 가 기본 번들하는 npm 10.x 에는 `npm ci` + optionalDependencies 조합에서
      # EBADPLATFORM 오탐이 나는 회귀가 있다(2026-08-23 확인). npm 11 에서는 재현되지 않는다.
      - name: Update npm (npm 10.x npm-ci EBADPLATFORM 회귀 회피)
        run: npm install -g npm@11

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit

      # 스포일러 차단이 이 프로젝트의 본질이다 — 게이트 테스트가 깨진 채로 배포하지 않는다
      - name: Test
        working-directory: backend
        run: npm test

  deploy:
    name: Fly.io 배포
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # --remote-only: Fly 빌더에서 이미지를 만든다. GitHub 러너에 Docker 를
      # 세팅하지 않아도 되고, 빌드 캐시가 Fly 쪽에 남아 재배포가 빠르다.
      - name: Deploy
        working-directory: backend
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 배포 요약
        working-directory: backend
        run: |
          echo "### 백엔드 배포 완료" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 브랜치: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- 커밋: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "스케일-투-제로가 켜져 있으므로 첫 요청에서 머신이 깨어난다(콜드스타트)." >> $GITHUB_STEP_SUMMARY
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
